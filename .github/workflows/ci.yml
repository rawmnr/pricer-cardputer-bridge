name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pc/uv.lock"
      - name: Sync
        run: uv sync --project .\pc --all-groups --frozen
      - name: Ruff
        run: uv run --frozen --project .\pc ruff check .\pc
      - name: Format
        run: uv run --frozen --project .\pc ruff format --check .\pc
      - name: Mypy
        run: uv run --frozen --project .\pc mypy .\pc\src
      - name: Tests
        run: uv run --frozen --project .\pc pytest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware application
        run: pio run -d firmware
      - name: Validate and stage M5Launcher application binary
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path("firmware/.pio/build/m5stack-cardputer-adv/firmware.bin")
          data = source.read_bytes()
          if not data:
              raise SystemExit("firmware.bin is empty")
          if data[0] != 0xE9:
              raise SystemExit(
                  f"firmware.bin does not start with ESP image magic 0xE9: 0x{data[0]:02X}"
              )

          short_sha = os.environ["GITHUB_SHA"][:7]
          destination = Path("dist") / (
              f"pricer-cardputer-bridge-cardputer-adv-{short_sha}.bin"
          )
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(data)
          print(f"Staged {destination} ({len(data)} bytes)")
          PY
      - name: Upload M5Launcher application artifact
        uses: actions/upload-artifact@v4
        with:
          name: pricer-cardputer-bridge-cardputer-adv-${{ github.sha }}
          path: dist/*.bin
          if-no-files-found: error
          retention-days: 30
