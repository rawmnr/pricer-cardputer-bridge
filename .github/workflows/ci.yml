name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pc/uv.lock"
      - name: Sync
        run: uv sync --project .\pc --all-groups
      - name: Ruff
        run: uv run --project .\pc ruff check .\pc
      - name: Format
        run: uv run --project .\pc ruff format --check .\pc
      - name: Mypy
        run: uv run --project .\pc mypy .\pc\src
      - name: Tests
        run: uv run --project .\pc pytest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -d firmware
